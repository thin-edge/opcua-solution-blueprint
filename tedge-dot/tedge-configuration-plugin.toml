# Configuration types of the ThinEdge demo container, plus three for the tedge-dot variant of the
# OPC-UA demo. Pushed to the device by `opcua-demo.sh start <device> --connector tedge-dot` as the
# `tedge-configuration-plugin` configuration (a type thin-edge.io always manages).
#
# The first six entries are the demo container's own list, unchanged: pushing this file replaces
# the device's list, so a device with other types needs them added here.

[[files]]
path = '/etc/tedge/tedge.toml'
type = 'tedge.toml'
user = 'tedge'
group = 'tedge'
mode = 0o444

[[files]]
path = '/etc/tedge/plugins/tedge-log-plugin.toml'
type = 'tedge-log-plugin'
user = 'tedge'
group = 'tedge'
mode = 0o644

[[files]]
path = '/etc/tedge/system.toml'
type = 'system.toml'
user = 'tedge'
group = 'tedge'
mode = 0o444

[[files]]
path = '/etc/mosquitto/conf.d/mosquitto.conf'
type = 'mosquitto.conf'
user = 'root'
group = 'root'
mode = 0o644

[[files]]
path = '/etc/collectd/collectd.conf'
type = 'collectd.conf'
user = 'root'
group = 'root'
mode = 0o644

[[files]]
path = '/etc/tedge-command-plugin/env'
type = 'shell'
user = 'tedge'
group = 'tedge'
mode = 0o644

# ---- tedge-dot ---------------------------------------------------------------------------

# Run by the config_update workflow below after every configuration update: reloads tedge-dot
# when one of its configs changed and publishes the measurement units.
[[files]]
path = '/etc/tedge/plugins/ot/post-update.sh'
type = 'tedge-dot-post-update'
user = 'tedge'
group = 'tedge'
mode = 0o755

# thin-edge.io's config_update workflow with one extra step that runs post-update.sh.
[[files]]
path = '/etc/tedge/operations/config_update.toml'
type = 'config_update-workflow'
user = 'tedge'
group = 'tedge'
mode = 0o644

# The OPC-UA connector configuration for the demo pump.
[[files]]
path = '/etc/tedge/plugins/ot/opcua-pump.toml'
type = 'tedge-dot-opcua-pump'
user = 'tedge'
group = 'tedge'
mode = 0o644
