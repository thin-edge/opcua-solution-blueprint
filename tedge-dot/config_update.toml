# thin-edge.io's config_update workflow (the default of thin-edge.io 2.0, unchanged) with one extra
# step: after a configuration has been written and verified, `post-update` runs
# /etc/tedge/plugins/ot/post-update.sh with the configuration type, which reloads tedge-dot when
# one of its configurations changed. Pushed to the device as the `config_update-workflow`
# configuration by `opcua-demo.sh start <device> --connector tedge-dot`.
operation = "config_update"
on_error = "failed"

[init]
action = "proceed"
on_success = "executing"

[executing]
action = "proceed"
on_success = "download"

[download]
action = "download"
on_success = "prepare"

[prepare]
action = "builtin:config_update:prepare"
input.setFrom = "${.payload.downloadedPath}"
on_success = "set"

[set]
action = "builtin:config_update:set"
on_success = "evaluate-agent-restart"
on_error = "rollback"

[evaluate-agent-restart]
script = "test ${.payload.restartAgent} = true"
on_exit.0 = "restart-agent"
on_exit.1 = "verify"

[restart-agent]
action = "restart-agent"
on_exec = "await-agent-restart"

[await-agent-restart]
action = "await-agent-restart"
timeout_second = 90
on_timeout = "rollback"
on_success = "verify"

[verify]
action = "builtin:config_update:verify"
on_success = "post-update"
on_error = "rollback"

# Added: reload tedge-dot after one of its configurations changed (does nothing for other types,
# or before post-update.sh has been installed).
[post-update]
script = "sh -c '[ ! -x /etc/tedge/plugins/ot/post-update.sh ] || /etc/tedge/plugins/ot/post-update.sh ${.payload.type}'"
on_success = "successful"
on_error = { status = "failed", reason = "the configuration was applied, but reloading tedge-dot failed" }

[rollback]
action = "builtin:config_update:rollback"
on_success = "failed"

[successful]
action = "cleanup"

[failed]
action = "cleanup"
