services:
  gateway:
    # Image is maintained under: https://github.com/thin-edge/opcua-device-gateway-container
    image: ghcr.io/thin-edge/opcua-device-gateway:latest
    container_name: opc-device-gateway
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Use configuration from https://cumulocity.com/docs/device-integration/opcua/#gateway-configuration-and-registration
      - C8Y_BASEURL=http://host.docker.internal:8001/c8y
      - GATEWAY_IDENTIFIER=OPCUAGateway
      - GATEWAY_NAME=OPCUAGateway
      - GATEWAY_THINEDGE_MQTTSERVERURL=tcp://host.docker.internal:1883
      - GATEWAY_THINEDGE_USEFORDATAFORWARDING=true
      - GATEWAY_THINEDGE_ENABLED=true

      # Enable the use of the HTTP proxy for Cumulocity communication, which is required when running in thin-edge mode
      - GATEWAY_THINEDGE_USEHTTPPROXY=true

      # Enables for measurements that are read in cyclic read to be batched into one measurement
      - GATEWAY_MAPPINGS_MERGECYCLICREAD=true
      - GATEWAY_MONITORING_INTERVAL=3600000

      # It is crucial to set  c8y.proxy.bind=0.0.0.0 on the host otherwise the container cannot reach to local thinEdge Proxy via host.docker.internal.
      # You can put that in /etc/tedge/tedge.toml
      # [c8y.proxy.bind]
      # address = "0.0.0.0"
      # or do tedge config set c8y.proxy.bind.address 0.0.0.0 on the host

      # In addition the outbound proxy for the thinEdge cli inside the container has to be disabled otherwise it tries to reach the local proxy over the external proxy.
      - TEDGE_PROXY_ADDRESS=
    volumes:
      - opcua_data:/app/data
      # Provide access to thin-edge.io configuration
      - /etc/tedge:/etc/tedge
      - /etc/tedge/device-certs:/etc/tedge/device-certs
    networks:
      - backend

volumes:
  opcua_data:

networks:
  backend:
    name: opc-ua-gateway_backend
